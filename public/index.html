<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e13" />
  <title>Weekly Budget</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="Weekly Budget" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Weekly Budget" />
  <style>
    :root {
      --appBg:#06070a; --chrome:rgba(12,14,19,0.9); --bg:#0c0e13; --bg2:#0f1219;
      --card:#15181f; --cardHi:#1c202a; --border:#262b36; --borderHi:#333a47;
      --text:#eef1f6; --sub:#98a2b3; --muted:#646e7e; --green:#34d399; --greenDim:#10b981;
      --red:#f87171; --amber:#fbbf24; --accent:#818cf8; --accent2:#22d3ee;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--appBg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    a { color: inherit; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--borderHi); }
    button { font-family: inherit; transition: transform 0.08s ease, filter 0.15s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; }
    button:active { transform: scale(0.98); }
    .hoverable { transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease; }
    .hoverable:hover { border-color: var(--borderHi); }
    .navitem:hover { background: var(--cardHi); }
    .lift:hover { transform: translateY(-2px); }

    /* ---- Desktop shell ---- */
    .shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
      border-right: 1px solid var(--border); background: var(--bg2); padding: 18px 14px; }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .content { width: 100%; max-width: 1160px; margin: 0 auto; padding: 26px 32px 60px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .dash-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
    .two-col { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
    .cal-grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
    .sticky-col { position: sticky; top: 26px; }

    /* ---- Responsive ---- */
    @media (max-width: 1080px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-grid, .cal-grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 320px 1fr; }
    }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      /* ---- Compact top header ---- */
      /* NB: no backdrop-filter here — it would make .sidebar the containing block
         for its fixed-position .sb-nav child, breaking the bottom bar. */
      .sidebar { position: sticky; top: 0; height: auto; flex-direction: row; flex-wrap: wrap;
        align-items: center; gap: 10px; z-index: 20; padding: 10px 14px; overflow: visible;
        border-right: none; border-bottom: 1px solid var(--border); background: var(--bg2);
        padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
      .sidebar .sb-logo { order: 1; padding: 0 !important; flex-shrink: 0; }
      .sidebar .sb-logo > :last-child { display: none; } /* icon-only wordmark on mobile → single-row header */
      .sidebar .sb-period { order: 2; flex: 1 1 auto; min-width: 150px; margin-bottom: 0 !important; }
      .sidebar .sb-settings { order: 3; width: auto !important; flex-shrink: 0;
        margin-top: 0 !important; padding: 10px !important; font-size: 0 !important; gap: 0 !important; }
      .sidebar .sb-account { order: 4; flex-basis: 100%; }
      .sidebar .sb-section-label { display: none; }
      .sidebar .sb-grow { display: none; }
      /* ---- Fixed bottom tab bar ---- */
      .sidebar .sb-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        flex-direction: row !important; gap: 0 !important;
        background: var(--chrome); backdrop-filter: blur(14px); border-top: 1px solid var(--border);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
      .sb-nav .navitem { width: auto !important; flex: 1; flex-direction: column;
        align-items: center; justify-content: center; text-align: center !important;
        gap: 3px !important; padding: 6px 2px !important; font-size: 10.5px !important; border-radius: 8px; }
      /* Ring cards: stack the ring above the details so they don't force horizontal overflow */
      .ring-card { flex-direction: column !important; align-items: stretch !important;
        min-width: 0 !important; gap: 18px !important; padding: 22px !important; }
      .ring-card > :first-child { align-self: center; }
      .content { padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
      .two-col, .sticky-col { grid-template-columns: 1fr; position: static; }
      .two-col { display: flex; flex-direction: column; }
    }
    @media (max-width: 520px) { .kpi-grid { grid-template-columns: 1fr; } }
  </style>
  <script src="react.js"></script>
  <script src="react-dom.js"></script>
  <script type="module">
    // Firebase v12 modular SDK. ES-module imports can't live inside the type="text/babel"
    // app script, so we init here and bridge the pieces we use onto window.__fb.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHrtB4w4B3AD_ea591fU_wTL1fn6S4JV4",
      authDomain: "budgeting-app-dfbde.firebaseapp.com",
      projectId: "budgeting-app-dfbde",
      storageBucket: "budgeting-app-dfbde.firebasestorage.app",
      messagingSenderId: "1017573847616",
      appId: "1:1017573847616:web:6df4e6a4c48d4af85de5a5"
    };

    try {
      const app = initializeApp(firebaseConfig);
      window.__fb = {
        auth: getAuth(app), db: getFirestore(app),
        GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut,
        doc, getDoc, setDoc, onSnapshot,
      };
      window.dispatchEvent(new Event("firebase-ready"));
    } catch (e) { window.__fbError = String(e); }
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js?v=muw719qe"></script>
  <script>
    // Offline + instant-load cache (sw.js is generated by build.js).
    if ("serviceWorker" in navigator) addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => reg.update()).catch(() => {});
    });
  </script>
</body>
</html>
